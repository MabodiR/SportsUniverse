name: Refresh Production Talent Showcases

on:
  workflow_dispatch:
    inputs:
      action:
        description: Audit sources or replace all existing posts with 1000 sports showcases
        required: true
        default: audit
        type: choice
        options:
          - audit
          - import
          - replace

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: [self-hosted, Linux, X64]
    environment: production
    timeout-minutes: 60
    steps:
      - name: Stop an orphaned previous full-feed deletion
        if: inputs.action == 'replace'
        run: |
          sudo -u postgres psql -d sportuniverse -v ON_ERROR_STOP=1 <<'SQL'
          SELECT pid, state, wait_event_type, left(query, 100) FROM pg_stat_activity
          WHERE datname = 'sportuniverse' AND usename = 'www-data' AND state = 'active';
          SELECT pg_cancel_backend(pid) FROM pg_stat_activity
          WHERE datname = 'sportuniverse' AND usename = 'www-data'
            AND query = 'delete from "videos"' AND state = 'active';
          SQL
      - name: Index references used by full-feed deletion
        if: inputs.action == 'replace'
        run: |
          sudo -u postgres psql -d sportuniverse -v ON_ERROR_STOP=1 <<'SQL'
          CREATE INDEX IF NOT EXISTS recommendation_feed_items_video_id_idx ON recommendation_feed_items (video_id);
          CREATE INDEX IF NOT EXISTS feed_preferences_video_id_idx ON feed_preferences (video_id);
          CREATE INDEX IF NOT EXISTS ad_campaigns_video_id_idx ON ad_campaigns (video_id);
          CREATE INDEX IF NOT EXISTS content_moderation_appeals_video_id_idx ON content_moderation_appeals (video_id);
          CREATE INDEX IF NOT EXISTS opportunity_application_documents_media_id_idx ON opportunity_application_documents (media_id);
          CREATE INDEX IF NOT EXISTS messages_media_id_idx ON messages (media_id);
          CREATE INDEX IF NOT EXISTS opportunity_applications_resume_media_id_idx ON opportunity_applications (resume_media_id);
          SQL
      - name: Import sports video sources
        if: inputs.action == 'import'
        working-directory: /var/www/sportuniverse
        run: sudo -u www-data php artisan db:seed --class=SportsMediaCatalogSeeder --force
      - name: Audit sports video sources and preview replacement
        working-directory: /var/www/sportuniverse
        run: |
          sudo -u www-data php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          foreach (Illuminate\Support\Facades\DB::table('media')->where('collection', 'performance-sports')->where('kind', 'video')->where('processing_status', 'ready')->where('moderation_status', 'approved')->get() as $source) {
              echo json_encode(['id' => $source->id, 'path' => $source->path, 'metadata' => json_decode($source->metadata, true), 'exists' => Illuminate\Support\Facades\Storage::disk($source->disk)->exists($source->path)], JSON_UNESCAPED_SLASHES).PHP_EOL;
          }
          PHP
          sudo -u www-data php artisan feed:refresh-talent-showcases --dry-run --count=1000
      - name: Replace all existing posts
        if: inputs.action == 'replace'
        working-directory: /var/www/sportuniverse
        run: sudo -u www-data php artisan feed:refresh-talent-showcases --count=1000 --force
      - name: Verify application health
        run: curl --fail --silent --show-error https://sportsuniverse.co.za/up
