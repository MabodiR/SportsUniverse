name: Deploy to xneelo Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xneelo-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: [self-hosted, Linux, X64, xneelo-production]
    environment: production
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify xneelo runner and toolchain
        run: |
          set -euo pipefail
          test "$(hostname)" = "sportuniverse-production"
          php --version
          composer --version
          node --version
          npm --version
          psql --version

      - name: Install build and test dependencies
        run: |
          set -euo pipefail
          composer install --prefer-dist --no-interaction --no-progress
          npm ci --include=optional --no-audit --no-fund

      - name: Build frontend
        env:
          NODE_OPTIONS: --max-old-space-size=1024
        run: npm run build

      - name: Validate release before deployment
        env:
          APP_ENV: testing
          APP_DEBUG: false
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: database/deployment.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: |
          set -euo pipefail
          : > database/deployment.sqlite
          php artisan migrate --force --no-interaction
          php artisan test --filter=EarlyAdopterPromotionTest
          php artisan route:list --except-vendor > /dev/null

      - name: Prepare production PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Back up and deploy production release
        shell: bash
        run: |
          set -Eeuo pipefail
          APP_DIR=/var/www/sportuniverse
          BACKUP_DIR=/var/backups/sportuniverse
          STAMP=$(date -u +%Y%m%d-%H%M%S)

          sudo test -f "$APP_DIR/.env"
          sudo install -d -m 750 -o postgres -g postgres "$BACKUP_DIR"

          users_before=$(sudo -u postgres psql -d sportuniverse -Atc \
            "SELECT CASE WHEN to_regclass('public.users') IS NULL THEN 0 ELSE (SELECT count(*) FROM users) END")
          echo "Production users before deployment: $users_before"

          sudo -u postgres pg_dump --format=custom \
            --file="$BACKUP_DIR/pre-deploy-$STAMP.dump" sportuniverse
          sudo chmod 600 "$BACKUP_DIR/pre-deploy-$STAMP.dump"

          sudo -u www-data php "$APP_DIR/artisan" down --retry=60
          trap 'sudo -u www-data php /var/www/sportuniverse/artisan up || true' EXIT

          sudo rsync -az --delete \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='actions-runner/' \
            --exclude='database/*.sqlite*' \
            --exclude='mobile-app/' \
            --exclude='node_modules/' \
            --exclude='bootstrap/cache/' \
            --exclude='public/storage' \
            --exclude='storage/' \
            --exclude='tests/' \
            ./ "$APP_DIR/"

          sudo chown -R www-data:www-data "$APP_DIR/storage" "$APP_DIR/bootstrap/cache"
          cd "$APP_DIR"
          sudo -u www-data php artisan optimize:clear
          sudo -u www-data php artisan migrate --force --no-interaction
          sudo -u www-data php artisan db:seed --class=Database\\Seeders\\SportSeeder --force
          sudo -u www-data php artisan db:seed --class=Database\\Seeders\\SubscriptionPlanSeeder --force
          sudo -u www-data php artisan db:seed --class=Database\\Seeders\\EarlyAdopterPromotionSeeder --force

          users_after=$(sudo -u postgres psql -d sportuniverse -Atc 'SELECT count(*) FROM users')
          echo "Production users after deployment: $users_after"
          if [ "$users_after" -lt "$users_before" ]; then
            echo "Refusing deployment: production user count decreased." >&2
            exit 1
          fi

          sudo install -m 644 deploy/sportuniverse-queue.service /etc/systemd/system/sportuniverse-queue.service
          sudo install -m 644 deploy/sportuniverse-reverb.service /etc/systemd/system/sportuniverse-reverb.service
          sudo install -m 644 deploy/sportuniverse-scheduler.service /etc/systemd/system/sportuniverse-scheduler.service
          sudo install -m 644 deploy/sportuniverse-scheduler.timer /etc/systemd/system/sportuniverse-scheduler.timer
          sudo install -m 644 deploy/php-upload.ini /etc/php/8.3/fpm/conf.d/99-sportuniverse-upload.ini
          sudo install -m 644 deploy/php-upload.ini /etc/php/8.3/cli/conf.d/99-sportuniverse-upload.ini
          sudo php artisan storage:link --force
          sudo -u www-data php artisan optimize
          sudo systemctl daemon-reload
          sudo systemctl enable --now sportuniverse-scheduler.timer
          sudo systemctl restart sportuniverse-queue.service sportuniverse-reverb.service
          sudo systemctl reload php8.3-fpm.service nginx.service
          sudo -u www-data php artisan up
          trap - EXIT

      - name: Verify production health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --header 'Host: sportsuniverse.co.za' http://127.0.0.1/up > /dev/null
          curl --fail --silent --show-error --header 'Host: sportsuniverse.co.za' http://127.0.0.1/ > /dev/null
          curl --fail --silent --show-error --header 'Host: sportsuniverse.co.za' http://127.0.0.1/feed > /dev/null
          sudo systemctl is-active --quiet nginx php8.3-fpm postgresql redis-server
          sudo systemctl is-active --quiet sportuniverse-queue sportuniverse-reverb

      - name: Deployment summary
        if: always()
        run: |
          echo "### xneelo production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runner: \`$(hostname)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"
